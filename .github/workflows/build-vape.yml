name: Build BoTT Vape Fabric Core

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v4

      - name: Checkout Vapor Fabric source
        uses: actions/checkout@v4
        with:
          repository: Crazyrxy/Vapor-FabricMC1.21.11_v4.21-source-port
          path: vapor-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch 1.21.11 compatibility
        working-directory: vapor-source/vapor421-1.21.11-port
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fabric_client = Path("src/main/java/gg/vape/fabric/VaporFabricClient.java")
          s = fabric_client.read_text(encoding="utf-8")

          s = s.replace(
              "net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper",
              "net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper"
          )
          s = s.replace(
              "KeyMappingHelper.registerKeyMapping(",
              "KeyBindingHelper.registerKeyBinding("
          )
          s = s.replace(
              "client.gui.setScreen(activeGuiScreen)",
              "client.setScreen(activeGuiScreen)"
          )
          s = s.replace(
              "RenderSystem.getModelViewMatrixCopy()",
              "new org.joml.Matrix4f()"
          )
          fabric_client.write_text(s, encoding="utf-8")

          mixin = Path("src/main/java/gg/vape/fabric/mixin/MinecraftMixin.java")
          ms = mixin.read_text(encoding="utf-8")
          old = '''    @Inject(method = "pick", at = @At("TAIL"))
    private void vapor421$afterPick(float partialTick, CallbackInfo callbackInfo) {
        if (!VaporFabricClient.isReady()) return;
        new EventMouseOverUpdate(partialTick).fire();
    }'''
          new = '''    @Inject(method = "tick", at = @At("TAIL"))
    private void vapor421$afterClientTick(CallbackInfo callbackInfo) {
        if (!VaporFabricClient.isReady()) return;
        new EventMouseOverUpdate(0.0F).fire();
    }'''
          if old not in ms:
              raise SystemExit("Expected stale pick() injection was not found")
          ms = ms.replace(old, new)
          mixin.write_text(ms, encoding="utf-8")

          print("Fixed MinecraftMixin: pick() -> tick()")
          PY

          grep -nE 'KeyBindingHelper|setScreen|Matrix4f' src/main/java/gg/vape/fabric/VaporFabricClient.java
          grep -nE 'afterClientTick|@Inject\(method = "tick"' src/main/java/gg/vape/fabric/mixin/MinecraftMixin.java

      - name: Build Vapor Fabric 1.21.11
        working-directory: vapor-source/vapor421-1.21.11-port
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Vapor Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: vapor421-fabric-4.21.0-fixed
          path: vapor-source/vapor421-1.21.11-port/build/libs/Vapor-FabricMC1.21.11_v4.21.jar
          if-no-files-found: error
