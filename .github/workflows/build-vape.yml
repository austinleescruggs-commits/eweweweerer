name: Build BoTT Vape Fabric Core

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v4

      - name: Checkout Vapor Fabric source
        uses: actions/checkout@v4
        with:
          repository: Crazyrxy/Vapor-FabricMC1.21.11_v4.21-source-port
          path: vapor-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch 1.21.11 compatibility
        working-directory: vapor-source/vapor421-1.21.11-port
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/main/java/gg/vape/fabric/VaporFabricClient.java")
          s = p.read_text(encoding="utf-8")

          # Fabric API package/method
          s = s.replace(
              "net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper",
              "net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper"
          )
          s = s.replace(
              "KeyMappingHelper.registerKeyMapping(",
              "KeyBindingHelper.registerKeyBinding("
          )

          # Minecraft 1.21.11 Screen API
          s = s.replace(
              "client.gui.setScreen(activeGuiScreen)",
              "client.setScreen(activeGuiScreen)"
          )

          # The upstream 1.21.11 official mappings use GuiGraphicsExtractor.
          s = s.replace(
              "net.minecraft.client.gui.GuiGraphics",
              "net.minecraft.client.gui.GuiGraphicsExtractor"
          )
          s = s.replace(
              "GuiGraphics graphics",
              "GuiGraphicsExtractor graphics"
          )

          # Screen.extractBackground is not an override in this mappings revision.
          marker = "        @Override\n        public void extractBackground(GuiGraphicsExtractor graphics"
          s = s.replace(marker, "        public void extractBackground(GuiGraphicsExtractor graphics")

          # RenderSystem.getModelViewMatrixCopy() was removed.  The recovered
          # render callback only needs a matrix object for its legacy bridge.
          s = s.replace(
              "RenderSystem.getModelViewMatrixCopy()",
              "new org.joml.Matrix4f()"
          )

          p.write_text(s, encoding="utf-8")

          print("Patched VaporFabricClient.java")
          for i, line in enumerate(s.splitlines(), 1):
              if any(x in line for x in ["KeyBindingHelper", "GuiGraphicsExtractor", "new org.joml.Matrix4f()", "client.setScreen"]):
                  print(f"{i}: {line}")

          # Keep the source project's already-correct Fabric API dependency.
          PY

      - name: Build Vapor Fabric 1.21.11
        working-directory: vapor-source/vapor421-1.21.11-port
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Vapor Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: vapor421-fabric-4.21.0
          path: vapor-source/vapor421-1.21.11-port/build/libs/Vapor-FabricMC1.21.11_v4.21.jar
          if-no-files-found: error
